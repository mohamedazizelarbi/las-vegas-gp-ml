&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;
  const root = document.getElementById(&quot;lv26-race-lab&quot;);
  const find = id =&gt; root.querySelector(&quot;#lv26-&quot; + id);
  const D = JSON.parse(find(&quot;data&quot;).textContent);
const post = D.post.summary;
  const actualByDriver = Object.fromEntries(D.post.field.map(r =&gt; [String(r.driver_number), r]));
  const actualResult = r =&gt; r.status === &quot;finished&quot; ? &quot;P&quot;+r.position : (r.position ? &quot;P&quot;+r.position+&quot; (&quot;+r.status+&quot;)&quot; : r.status);
  function renderPostRace() {
    const events = post.race_events;
    const winner = actualByDriver[post.winner];
    find(&quot;post-winner&quot;).textContent=percent(winner.win)+&quot; simulated win chance&quot;;
    find(&quot;post-mae&quot;).textContent=fmt(post.mae.simulation)+&quot; places&quot;;
    find(&quot;post-grid&quot;).textContent=fmt(post.mae.grid)+&quot; from forecast grid · &quot;+post.finishers+&quot; finishers&quot;;
    find(&quot;post-top10&quot;).textContent=events.top10.top_pick_overlap+&quot;/10 points finishers&quot;;
    find(&quot;post-podium&quot;).textContent=events.podium.top_pick_overlap+&quot;/3 podium drivers&quot;;
    find(&quot;post-dnf&quot;).textContent=fmt(events.dnf.expected_count)+&quot; expected DNFs among &quot;+post.starters+&quot; starters · &quot;+events.dnf.actual_count+&quot; observed · Albon DNS&quot;;
    find(&quot;post-table&quot;).innerHTML=D.post.field.map(r=&gt;
      &#x27;&lt;tr&gt;&lt;td&gt;&#x27;+escape(actualResult(r))+&#x27;&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;&#x27;+escape(r.driver)+&#x27;&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;P&#x27;+r.forecast_grid+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+fmt(r.expected)+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+r.points+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+escape(r.outcome_probability===null?&quot;—&quot;:percent(r.outcome_probability))+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;
    ).join(&quot;&quot;);
    const study=D.post.experiment.events;
    const labels={podium:&quot;Podium&quot;,points:&quot;Points finish (top 10)&quot;,dnf:&quot;Retirement (DNF)&quot;};
    find(&quot;post-study&quot;).innerHTML=Object.entries(study).map(([key,r])=&gt;&#x27;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&#x27;+labels[key]+&#x27;&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+fmt(r.frozen_model.brier,4)+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+fmt(r.challenger.brier,4)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&quot;&quot;);
    const risk=study.dnf;
    find(&quot;post-study-note&quot;).textContent=&quot;Mean DNF probability changed from &quot;+percent(risk.frozen_model.mean_probability)+&quot; to &quot;+percent(risk.challenger.mean_probability)+&quot; versus &quot;+percent(risk.frozen_model.observed_rate)+&quot; observed. Archived Vegas odds are unchanged.&quot;;
  }


  const fmt = (n, digits = 2) =&gt; n == null ? &quot;—&quot; : Number(n).toFixed(digits);
  const percent = n =&gt; n == null ? &quot;—&quot; : (n &gt; 0 &amp;&amp; n &lt; .0001 ? &quot;&lt;0.01%&quot; : (100*n).toFixed(2) + &quot;%&quot;);
  const gap = n =&gt; n == null ? &quot;—&quot; : ((n &gt; 0 ? &quot;+&quot; : &quot;&quot;) + fmt(n) + &quot;%&quot;);
  const lap = n =&gt; n == null ? &quot;—&quot; : Math.floor(n / 60) + &quot;:&quot; + (n % 60).toFixed(3).padStart(6,&quot;0&quot;);
  const dnfText = x =&gt; x[4] ? &quot;DNF&quot; : (x[3] ?? &quot;—&quot;);
  const escape = v =&gt; String(v).replaceAll(&quot;&amp;&quot;,&quot;&amp;amp;&quot;).replaceAll(&quot;&lt;&quot;,&quot;&amp;lt;&quot;).replaceAll(&quot;&gt;&quot;,&quot;&amp;gt;&quot;).replaceAll(&#x27;&quot;&#x27;,&quot;&amp;quot;&quot;);
  const model = find(&quot;model&quot;), driver = find(&quot;driver-id&quot;);
  for (const [key, name] of Object.entries(D.labels)) model.add(new Option(name, key));
  const byRank = Object.entries(D.field).sort((a,b)=&gt;a[1].rank-b[1].rank);
  for (const [key, d] of byRank) driver.add(new Option(d.name, key));
  model.value = &quot;current&quot;;
  driver.value = &quot;3&quot;;
  const series1 = &quot;var(--viz-series-1)&quot;, series2 = &quot;var(--viz-series-2)&quot;;
  const text = (x,y,label,extra=&quot;&quot;) =&gt; &#x27;&lt;text x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; &#x27;+extra+&#x27;&gt;&#x27;+escape(label)+&#x27;&lt;/text&gt;&#x27;;
  const line = (x,y,x2,y2,style=&quot;&quot;) =&gt; &#x27;&lt;line class=&quot;plot-grid&quot; x1=&quot;&#x27;+x+&#x27;&quot; x2=&quot;&#x27;+x2+&#x27;&quot; y1=&quot;&#x27;+y+&#x27;&quot; y2=&quot;&#x27;+y2+&#x27;&quot; &#x27;+style+&#x27;/&gt;&#x27;;
  const svg = (w,h,what,marks) =&gt; &#x27;&lt;svg viewBox=&quot;0 0 &#x27;+w+&#x27; &#x27;+h+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; role=&quot;img&quot; aria-label=&quot;&#x27;+escape(what)+&#x27;&quot;&gt;&#x27;+marks+&#x27;&lt;/svg&gt;&#x27;;
  const dot = (x,y,r,color,tip) =&gt; &#x27;&lt;circle cx=&quot;&#x27;+x+&#x27;&quot; cy=&quot;&#x27;+y+&#x27;&quot; r=&quot;&#x27;+r+&#x27;&quot; fill=&quot;&#x27;+color+&#x27;&quot; data-tooltip=&quot;&#x27;+escape(tip)+&#x27;&quot;/&gt;&#x27;;
  function facts(el, rows) {
    el.innerHTML=rows.map(([k,v])=&gt;&#x27;&lt;dt&gt;&#x27;+escape(k)+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+escape(v)+&#x27;&lt;/dd&gt;&#x27;).join(&quot;&quot;);
  }
  function renderForecast() {
    const key=model.value, n=driver.value, d=D.field[n];
    find(&quot;field&quot;).innerHTML=byRank.map(([id,r])=&gt;{
      const prob=r.prob[key], value=percent(prob);
      return &#x27;&lt;tr class=&quot;driver-row&quot; aria-current=&quot;&#x27;+(id===n)+&#x27;&quot;&gt;&lt;td&gt;&#x27;+r.rank+&#x27;&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-driver=&quot;&#x27;+id+&#x27;&quot;&gt;&#x27;+escape(r.name)+&#x27;&lt;/button&gt;&lt;div class=&quot;text-small note&quot;&gt;&#x27;+escape(r.team)+&#x27;&lt;/div&gt;&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+r.grid+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+fmt(r.finish)+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&lt;div class=&quot;measure&quot;&gt;&lt;div class=&quot;progress&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;progress-bar&quot; style=&quot;width:&#x27;+(prob*100)+&#x27;%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;&#x27;+escape(value)+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    }).join(&quot;&quot;);
    find(&quot;name&quot;).textContent=d.name;
    find(&quot;team&quot;).textContent=d.team;
    facts(find(&quot;selected&quot;),[
      [&quot;Win chance&quot;,percent(d.prob[key])],[&quot;Simulated podium&quot;,percent(D.sim.field[n].podium)],[&quot;Simulated points finish&quot;,percent(D.sim.field[n].points)],[&quot;Simulated DNF&quot;,percent(D.sim.field[n].dist[22])],[&quot;Ridge estimated finish&quot;,fmt(d.finish)],[&quot;FIA final result&quot;,actualResult(actualByDriver[n])],[&quot;Starting grid&quot;,&quot;P&quot;+d.grid],
      [&quot;Qualifying position&quot;,d.quali==null?&quot;—&quot;:&quot;P&quot;+d.quali],[&quot;Q3 lap&quot;,lap(d.q[2])],
      [&quot;FP2 best lap&quot;,lap(d.fp[0])],[&quot;FP3 best lap&quot;,lap(d.fp[1])],[&quot;Matched practice laps&quot;,d.matched],
      [&quot;Long-run pace gap&quot;,gap(d.long)],[&quot;Driver recent race-pace gap&quot;,gap(d.driverPace)],
      [&quot;Constructor recent race-pace gap&quot;,gap(d.teamPace)],[&quot;Driver recent DNF rate&quot;,percent(d.driverDnf)],
    ]);
    const venue=D.venue;
    facts(find(&quot;venue&quot;),[[&quot;Historical retirements&quot;,venue.dnf+&quot; / &quot;+venue.starts+&quot; starts&quot;],
      [&quot;Mean absolute grid-to-finish change&quot;,fmt(venue.movement,1)+&quot; places&quot;],
      [&quot;Classified grid/finish pairs used&quot;,venue.matched]]);
  }
  function frame(el) {
    const w=Math.max(230,Math.floor(el.clientWidth)), h=226;
    return [w,h,{l:48,t:22,r:w-16,b:h-44}];
  }
  function seriesChart(el, observations, valueIndexes, colors, domain, yTicks, format, label, xName) {
    if (!el.clientWidth) return;
    const [w,h,a]=frame(el);
    const minX=1, maxX=Math.max(2,...observations.map(row=&gt;row[0]),20);
    const x=n=&gt;a.l+(n-minX)/(maxX-minX)*(a.r-a.l);
    const y=n=&gt;a.b-(n-domain[0])/(domain[1]-domain[0])*(a.b-a.t);
    const ticks=w&lt;400?[1,10,20]:[1,5,10,15,20];
    let body=yTicks.map(v=&gt;line(a.l,y(v),a.r,y(v))+text(a.l-7,y(v)+4,format(v),&#x27;text-anchor=&quot;end&quot;&#x27;)).join(&quot;&quot;);
    body+=ticks.map(v=&gt;text(x(v),a.b+18,v,&#x27;text-anchor=&quot;middle&quot;&#x27;)).join(&quot;&quot;);
    body+=text((a.l+a.r)/2,h-5,xName,&#x27;text-anchor=&quot;middle&quot;&#x27;);
    valueIndexes.forEach((k,j)=&gt;{
      let previous=null;
      for (const entry of observations) {
        const value=entry[k];
        if (value==null) {previous=null;continue;}
        if (previous &amp;&amp; previous[0]+1===entry[0]) {
          body+=&#x27;&lt;line x1=&quot;&#x27;+x(previous[0])+&#x27;&quot; y1=&quot;&#x27;+y(previous[k])+&#x27;&quot; x2=&quot;&#x27;+x(entry[0])+&#x27;&quot; y2=&quot;&#x27;+y(value)+&#x27;&quot; stroke=&quot;&#x27;+colors[j]+&#x27;&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
        }
        body+=dot(x(entry[0]),y(value),3.5,colors[j],entry[1]+&quot; · &quot;+format(value));
        previous=entry;
      }
    });
    el.innerHTML=svg(w,h,label,body);
  }
  function renderDriver() {
    const n=driver.value, d=D.field[n], rows=D.history[n]||[];
    find(&quot;history-title&quot;).textContent=d.name+&quot; · grid and finish&quot;;
    const finished=rows.filter(r=&gt;r[3]!=null&amp;&amp;!r[4]), starts=rows.filter(r=&gt;r[2]!=null);
    const avg=values=&gt;values.length?fmt(values.reduce((a,b)=&gt;a+b,0)/values.length,1):&quot;—&quot;;
    facts(find(&quot;season&quot;),[[&quot;Grand Prix starts&quot;,rows.length],[&quot;Wins&quot;,finished.filter(r=&gt;r[3]===1).length],
      [&quot;Podiums&quot;,finished.filter(r=&gt;r[3]&lt;=3).length],[&quot;Retirements&quot;,rows.filter(r=&gt;r[4]).length],
      [&quot;Average grid&quot;,avg(starts.map(r=&gt;r[2]))],[&quot;Average finish when finishing&quot;,avg(finished.map(r=&gt;r[3]))]]);
    find(&quot;results&quot;).innerHTML=rows.slice().reverse().map(r=&gt;&#x27;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&#x27;+escape(r[1])+&#x27;&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+(r[2]??&quot;—&quot;)+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+dnfText(r)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&quot;&quot;);
    const plotted=rows.map(r=&gt;r[4]?[...r.slice(0,3),null,...r.slice(4)]:r);
    seriesChart(find(&quot;history-chart&quot;),plotted,[2,3],[series1,series2],[23,1],[1,5,10,15,22],v=&gt;&quot;P&quot;+v,d.name+&quot; starting grid and finishing position by race&quot;,&quot;Grand Prix round&quot;);
    const vals=rows.flatMap(r=&gt;[r[5],r[6]]).filter(Number.isFinite);
    const low=Math.min(-1,Math.floor(Math.min(...vals))), high=Math.max(1,Math.ceil(Math.max(...vals)));
    const ticks=Array.from(new Set([low,0,high])).sort((a,b)=&gt;a-b);
    seriesChart(find(&quot;pace-chart&quot;),rows,[5,6],[series1,series2],[high,low],ticks,v=&gt;fmt(v,1)+&quot;%&quot;,d.name+&quot; qualifying and prior race-pace gaps&quot;,&quot;Grand Prix round&quot;);
  }
  function renderBacktest() {
    const key=model.value, selected=D.tests[key];
    find(&quot;test-head&quot;).textContent=D.labels[key]+&quot; · &quot;+selected.races+&quot; races · &quot;+selected.top_pick_hits+&quot; winners picked&quot;;
    find(&quot;review&quot;).innerHTML=Object.keys(D.labels).map(k=&gt;{
      const m=D.tests[k];
      return &#x27;&lt;tr class=&quot;driver-row&quot; aria-current=&quot;&#x27;+(k===key)+&#x27;&quot;&gt;&lt;th scope=&quot;row&quot;&gt;&#x27;+escape(D.labels[k])+&#x27;&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+fmt(m.log_loss,4)+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+fmt(m.brier,4)+&#x27;&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;&#x27;+m.top_pick_hits+&#x27;/&#x27;+m.races+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    }).join(&quot;&quot;);
    const target=find(&quot;cal-chart&quot;);
    if (!target.clientWidth) return;
    const [w,h,a]=frame(target);
    const x=v=&gt;a.l+(a.r-a.l)*v, y=v=&gt;a.b-(a.b-a.t)*v;
    let marks=[0,.5,1].map(v=&gt;line(a.l,y(v),a.r,y(v))+text(a.l-7,y(v)+4,Math.round(v*100)+&quot;%&quot;,&#x27;text-anchor=&quot;end&quot;&#x27;)+text(x(v),a.b+19,Math.round(v*100)+&quot;%&quot;,&#x27;text-anchor=&quot;middle&quot;&#x27;)).join(&quot;&quot;);
    marks+=line(a.l,a.b,a.r,a.t)+&#x27;&lt;line x1=&quot;&#x27;+a.l+&#x27;&quot; y1=&quot;&#x27;+a.b+&#x27;&quot; x2=&quot;&#x27;+a.r+&#x27;&quot; y2=&quot;&#x27;+a.t+&#x27;&quot; stroke=&quot;var(--muted-foreground)&quot; stroke-dasharray=&quot;4 5&quot;/&gt;&#x27;;
    for(const [p,r,n] of D.bins[key]) marks+=dot(x(p),y(r),4+Math.sqrt(n)*.9,series1,n+&quot; races · &quot;+percent(p)+&quot; predicted · &quot;+percent(r)+&quot; observed&quot;);
    marks+=text((a.l+a.r)/2,h-4,&quot;Predicted win chance&quot;,&#x27;text-anchor=&quot;middle&quot;&#x27;);
    target.innerHTML=svg(w,h,&quot;Winning frequency for each predicted favorite probability band&quot;,marks);
    const targetGain=find(&quot;gain-chart&quot;);
    const [gw,gh,g]=frame(targetGain);
    const diffs=D.races.map(r=&gt;Math.log(r.winner[key])-Math.log(r.winner.grid_only));
    const bound=Math.max(.25,...diffs.map(Math.abs));
